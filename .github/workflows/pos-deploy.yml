name: POS - Deploy to Azure

on:
  push:
    branches:
      - release/point-of-sale
    paths:
      - "pos/src/**"
      - "pos/index.html"
      - "pos/package.json"
      - "pos/package-lock.json"
      - "pos/vite.config.ts"
      - "pos/tailwind.config.js"
      - "pos/postcss.config.js"
      - "pos/tsconfig*.json"
      - ".github/workflows/pos-deploy.yml"

concurrency:
  group: pos-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pos/package-lock.json
      - name: Install dependencies
        working-directory: ./pos
        run: npm ci
      - name: Build POS
        working-directory: ./pos
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.POS_VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.POS_VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_ENABLE_HISTORY_DELETE: "true"
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POS }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./pos/dist"
          output_location: ""
          skip_app_build: true