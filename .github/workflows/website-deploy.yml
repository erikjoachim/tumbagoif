name: Website - Deploy to Azure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "!**.md"
      - "!AGENTS.md"

concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      # Uncomment this step when the website starts consuming the ui lib:
      # - name: Build @tumbagoif/ui
      #   run: npm run build --workspace @tumbagoif/ui
      - name: Build website
        run: npm run build --workspace website
        env:
          VITE_UNDER_CONSTRUCTION: "true"
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./website/dist"
          output_location: ""
          skip_app_build: true
