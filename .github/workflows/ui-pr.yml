name: UI - Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - "ui/**"
      - "!**.md"
      - "!AGENTS.md"

concurrency:
  group: ui-pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build @tumbagoif/ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build @tumbagoif/ui
        run: npm run build --workspace @tumbagoif/ui

  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prettier check
        run: npx prettier --check "ui/**/*.{js,ts,vue,css,json,html}"