name: Website - Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - "website/**"
      - "!**.md"
      - "!AGENTS.md"

concurrency:
  group: website-pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      # Uncomment this step when the website starts consuming the ui lib:
      # - name: Build @tumbagoif/ui
      #   run: npm run build --workspace @tumbagoif/ui
      - name: Build website
        run: npm run build --workspace website

  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prettier check
        run: npx prettier --check "website/**/*.{js,ts,vue,css,json,html}"
